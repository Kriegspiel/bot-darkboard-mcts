[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-darkboard-mcts"
version = "0.2.0"
description = "Darkboard-inspired Kriegspiel bot research scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kriegspiel"}]
dependencies = [
    "chess>=1.11.2",
    "requests>=2.32.0",
]

[project.scripts]
darkboard-mcts-bot = "darkboard_mcts.api:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
